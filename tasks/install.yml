---
# Each time the container starts, the linuxserver/ddclient image sets the mode of
# /config (ddclient_config_path on the host) to 0700 and of every file in it to 0600.
# The config directory and ddclient.conf use the same modes, so that the next playbook
# run does not change them back and mark ddclient for a restart.
- name: Ensure ddclient paths exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
    owner: "{{ ddclient_uid }}"
    group: "{{ ddclient_gid }}"
  with_items:
    - {path: "{{ ddclient_base_path }}", mode: "0750"}
    - {path: "{{ ddclient_config_path }}", mode: "0700"}

- name: Ensure ddclient support file installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item }}.j2"
    dest: "{{ ddclient_base_path }}/{{ item }}"
    mode: "0640"
    owner: "{{ ddclient_uid }}"
    group: "{{ ddclient_gid }}"
  with_items:
    - env
  register: ddclient_support_files_result

# Matches the mode the container image sets; see "Ensure ddclient paths exist".
- name: Ensure ddclient ddclient.conf installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/ddclient.conf.j2"
    dest: "{{ ddclient_config_path }}/ddclient.conf"
    mode: "0600"
    owner: "{{ ddclient_uid }}"
    group: "{{ ddclient_gid }}"
  register: ddclient_config_file_result

- name: Run if self-building of ddclient container image is not enabled
  when: "not ddclient_container_image_self_build | bool"
  block:
    - name: Ensure ddclient container image is pulled via community.docker.docker_image_pull
      when: devture_systemd_docker_base_container_image_pull_method == 'ansible-module'
      community.docker.docker_image_pull:
        name: "{{ ddclient_container_image }}"
        pull: always
      register: ddclient_container_image_pull_result_ansible_module
      retries: "{{ devture_playbook_help_container_retries_count }}"
      delay: "{{ devture_playbook_help_container_retries_delay }}"
      until: ddclient_container_image_pull_result_ansible_module is not failed

    - name: Ensure ddclient container image is pulled via ansible.builtin.command
      when: devture_systemd_docker_base_container_image_pull_method == 'command'
      ansible.builtin.command:
        cmd: "{{ devture_systemd_docker_base_host_command_docker }} pull {{ ddclient_container_image }}"
      register: ddclient_container_image_pull_result_command
      retries: "{{ devture_playbook_help_container_retries_count }}"
      delay: "{{ devture_playbook_help_container_retries_delay }}"
      until: ddclient_container_image_pull_result_command is not failed
      changed_when: "'Downloaded newer image' in ddclient_container_image_pull_result_command.stdout"

- name: Run if self-building of ddclient container image is enabled
  when: "ddclient_container_image_self_build | bool"
  block:
    - name: Ensure ddclient repository is present on self-build
      ansible.builtin.git:
        repo: "{{ ddclient_container_image_self_build_repo }}"
        version: "{{ ddclient_container_image_self_build_repo_version }}"
        dest: "{{ ddclient_container_image_self_build_src_files_path }}"
        force: "yes"
      register: ddclient_git_pull_results

    - name: Ensure ddclient container image is built
      community.docker.docker_image_build:
        name: "{{ ddclient_container_image_self_build_name }}"
        dockerfile: Dockerfile
        path: "{{ ddclient_container_image_self_build_src_files_path }}"
        pull: true
        args:
        rebuild: "{{ 'always' if ddclient_git_pull_results.changed | bool else 'never' }}"
      register: ddclient_container_image_build_result

- name: Ensure ddclient container network is created via community.docker.docker_network
  when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
  community.docker.docker_network:
    enable_ipv6: "{{ devture_systemd_docker_base_ipv6_enabled }}"
    name: "{{ ddclient_container_network }}"
    driver: bridge
    driver_options: "{{ devture_systemd_docker_base_container_networks_driver_options }}"
  register: ddclient_network_creation_result

- name: Ensure ddclient container network is created via ansible.builtin.command
  when: devture_systemd_docker_base_container_network_creation_method == 'command'
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }} network create
      {% if devture_systemd_docker_base_ipv6_enabled %}--ipv6{% endif %}
      {{ devture_systemd_docker_base_container_networks_driver_options_string }}
      {{ ddclient_container_network }}
  register: ddclient_network_creation_result
  changed_when: ddclient_network_creation_result.rc == 0
  failed_when: ddclient_network_creation_result.rc != 0 and 'already exists' not in ddclient_network_creation_result.stderr

- name: Ensure ddclient systemd service is present
  ansible.builtin.template:
    src: "{{ role_path }}/templates/systemd/ddclient.service.j2"
    dest: "{{ devture_systemd_docker_base_systemd_path }}/{{ ddclient_identifier }}.service"
    mode: "0644"
  register: ddclient_systemd_service_result

- name: Determine whether ddclient needs a restart
  ansible.builtin.set_fact:
    ddclient_restart_necessary: >-
      {{
        ddclient_support_files_result.changed | default(false)
        or ddclient_config_file_result.changed | default(false)
        or ddclient_systemd_service_result.changed | default(false)
        or ddclient_container_image_pull_result_ansible_module.changed | default(false)
        or ddclient_container_image_pull_result_command.changed | default(false)
        or ddclient_container_image_build_result.changed | default(false)
      }}
