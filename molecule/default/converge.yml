---
- name: Include roles for ddclient Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Include roles for ddclient Molecule tests
      ansible.builtin.include_role:
        name: "{{ role_name }}"
        public: true
      loop:
        - com.devture.ansible.role.playbook_help
        - com.devture.ansible.role.systemd_docker_base
        - "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
      loop_control:
        loop_var: role_name

- name: Ensure ddclient service is started
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Ensure systemd daemon is reloaded
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Ensure ddclient systemd service is started
      ansible.builtin.systemd_service:
        name: ddclient.service
        state: started

    # The unit is Type=simple, so systemd counts it as started as soon as
    # `docker start` runs, which can be before the container has set the modes
    # under /config (see tasks/install.yml). The image starts the ddclient daemon
    # only after that, and the daemon retitles itself "ddclient - sleeping for
    # N seconds" once its first pass is done. Waiting for that title here makes
    # the idempotence converge run against the modes the container set, so a mode
    # mismatch shows up as a change instead of depending on how fast the
    # container starts.
    - name: Wait for the ddclient daemon to settle between passes (up to 120s)
      ansible.builtin.command:
        cmd: docker exec ddclient ps -eo args
      register: ddclient_process_list
      changed_when: false
      until: "'ddclient - sleeping for' in ddclient_process_list.stdout"
      retries: 24
      delay: 5
